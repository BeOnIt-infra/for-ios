name: iOS build check

# Compile-only verification for BeOnIt-infra's fork -- no code signing, no
# archive/export, just "does it build" for iOS Simulator. The upstream
# build.yml (Release archive + signing) is left untouched; this is a
# separate, much cheaper workflow used while developing on this fork.
on:
  push:
    branches: ["beonit-customizations"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      # Swift macro plugins (e.g. CodableWrapperMacros) normally need a
      # one-time "Trust and Enable" click in the Xcode GUI the first time a
      # project uses them; on a CI runner nothing has clicked that, so the
      # plugin binary fails to load ("produced malformed response").
      # -skipMacroValidation only skips fingerprint re-validation, not this
      # trust gate -- these defaults are the actual bypass for automation.
      - name: Trust Swift macro plugins for CI
        run: |
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: List schemes
        run: xcodebuild -list -project Stoat.xcodeproj

      - name: Build for iOS Simulator (compile check, no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme Stoat \
            -project Stoat.xcodeproj \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
